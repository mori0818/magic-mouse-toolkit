name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate scripts and plist
        run: |
          bash -n build.sh
          bash -n prototypes/virtual_trackpad/build.sh
          plutil -lint Info.plist

      - name: Build universal app
        run: ./build.sh

      - name: Verify app bundle
        run: |
          codesign --verify --deep --strict --verbose=2 "build/Magic Control.app"
          lipo -verify_arch x86_64 arm64 build/MagicControl
          plutil -lint "build/Magic Control.app/Contents/Info.plist"
