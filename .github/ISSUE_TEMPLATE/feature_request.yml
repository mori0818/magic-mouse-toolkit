name: Feature request
description: Suggest an improvement to Magic Mouse Toolkit
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or workflow problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: input_scope
    attributes:
      label: Input and privacy impact
      options:
        - label: This request explains whether it records, transforms, launches, or transmits user input.
          required: true
